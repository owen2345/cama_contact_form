# Runs on: a pull request or a `master` push of this repository.
# Tests:   the commit of this plugin, against the released camaleon_cms gem that Gemfile.lock pins.
# Checks:  `CI / RSpec (camaleon_cms <version>)` and `CI / RuboCop`.
#
# The checks against Camaleon code that is not released are in camaleon_master.yml and
# core_compat.yml.
#
# CI for the plugin's own suite: RSpec (against a camaleon_cms-backed dummy Rails app, see spec/) and
# RuboCop. Gemfile.lock is committed, so `bundler-cache: true` restores the exact, known gem set from
# cache instead of resolving and installing every run; the pinned camaleon_cms (floored at >= 2.9.4 in
# the Gemfile) is a current, non-vulnerable core.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reads the camaleon_cms version that Gemfile.lock pins. The name of the RSpec check shows it.
  locked:
    name: camaleon_cms version of Gemfile.lock
    runs-on: ubuntu-latest
    outputs:
      camaleon_cms: ${{ steps.read.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: Gemfile.lock
          sparse-checkout-cone-mode: false

      - name: Read the version
        id: read
        run: |
          version=$(sed -n 's/^    camaleon_cms (\([0-9][0-9A-Za-z.]*\))$/\1/p' Gemfile.lock | head -n 1)
          echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"

  rspec:
    name: RSpec (camaleon_cms ${{ needs.locked.outputs.camaleon_cms }})
    needs: locked
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The :js admin feature spec drives headless Chrome. The runner ships Chrome; this installs a
      # matching chromedriver on PATH, which Selenium Manager then uses instead of downloading one.
      - name: Set up Chromedriver
        uses: nanasess/setup-chromedriver@v3

      # ruby-version comes from .tool-versions. bundler-cache caches the installed gems keyed on the
      # committed Gemfile.lock; the sqlite3 gem ships a precompiled linux binary, so no apt packages
      # are needed.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          rubygems: 4.0.19
          bundler-cache: true

      # Rails/engine commands must run from the dummy app (this repo is a gem). Load the checked-in
      # schema into a fresh sqlite test database.
      - name: Prepare the test database
        run: bundle exec rails db:test:prepare
        working-directory: spec/dummy

      - name: Run the test suite
        run: bundle exec rspec

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          rubygems: 4.0.19
          bundler-cache: true

      # Cache RuboCop's own result cache (keyed on the config + lockfile) so unchanged files are not
      # re-inspected across runs. Mirrors camaleon_cms.
      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        with:
          path: tmp/rubocop
          key: rubocop-${{ runner.os }}-${{ hashFiles('.tool-versions', '.rubocop.yml', '.rubocop_todo.yml', 'Gemfile.lock') }}
          restore-keys: |
            rubocop-${{ runner.os }}-

      - name: Lint code for consistent style
        run: bin/rubocop
        env:
          RUBOCOP_CACHE_ROOT: tmp/rubocop
