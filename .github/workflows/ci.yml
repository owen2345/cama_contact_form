# CI for the plugin's own suite: RSpec (against a camaleon_cms-backed dummy Rails app, see spec/) and
# RuboCop. Gemfile.lock is committed, so `bundler-cache: true` restores the exact, known gem set from
# cache instead of resolving and installing every run; the pinned camaleon_cms (floored at >= 2.9.4 in
# the Gemfile) is a current, non-vulnerable core.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The :js admin feature spec drives headless Chrome. The runner ships Chrome; this installs a
      # matching chromedriver on PATH, which Selenium Manager then uses instead of downloading one.
      - name: Set up Chromedriver
        uses: nanasess/setup-chromedriver@v3

      # ruby-version comes from .tool-versions. bundler-cache caches the installed gems keyed on the
      # committed Gemfile.lock; the sqlite3 gem ships a precompiled linux binary, so no apt packages
      # are needed.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      # Rails/engine commands must run from the dummy app (this repo is a gem). Load the checked-in
      # schema into a fresh sqlite test database.
      - name: Prepare the test database
        run: bundle exec rails db:test:prepare
        working-directory: spec/dummy

      - name: Run the test suite
        run: bundle exec rspec

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          bundler-cache: true

      # Cache RuboCop's own result cache (keyed on the config + lockfile) so unchanged files are not
      # re-inspected across runs. Mirrors camaleon_cms.
      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        with:
          path: tmp/rubocop
          key: rubocop-${{ runner.os }}-${{ hashFiles('.tool-versions', '.rubocop.yml', '.rubocop_todo.yml', 'Gemfile.lock') }}
          restore-keys: |
            rubocop-${{ runner.os }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github
        env:
          RUBOCOP_CACHE_ROOT: tmp/rubocop
